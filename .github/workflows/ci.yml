name: Java CI with Maven

on:
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '1.8'
          distribution: 'temurin'

      - name: Build and Test with Maven
        run: mvn --batch-mode package --settings maven-settings.xml